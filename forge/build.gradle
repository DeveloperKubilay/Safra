plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.23,8.0)'
    id 'net.minecraftforge.renamer' version '1.0.14'
}

abstract class SafraMixinCompilerArgs implements org.gradle.process.CommandLineArgumentProvider {
    @org.gradle.api.tasks.InputFile
    @org.gradle.api.tasks.PathSensitive(org.gradle.api.tasks.PathSensitivity.NONE)
    abstract org.gradle.api.file.RegularFileProperty getInMappings()

    @org.gradle.api.tasks.OutputFile
    abstract org.gradle.api.file.RegularFileProperty getOutMappings()

    @org.gradle.api.tasks.OutputFile
    abstract org.gradle.api.file.RegularFileProperty getRefmap()

    @Override
    Iterable<String> asArguments() {
        [
            "-AreobfTsrgFile=${getInMappings().get().asFile.absolutePath}",
            "-AoutTsrgFile=${getOutMappings().get().asFile.absolutePath}",
            "-AoutRefMapFile=${getRefmap().get().asFile.absolutePath}",
            '-AmappingTypes=tsrg',
            '-ApluginVersion=0.7',
            '-AdefaultObfuscationEnv=searge'
        ]
    }
}

sourceSets {
    main {
        java.srcDir(project(':common').file('src/main/java'))
        resources.srcDir(project(':common').file('src/main/resources'))
        def commonCompatBucket = (rootProject.ext.common_bucket ?: '').toString()
        if (commonCompatBucket == '1.20' || commonCompatBucket == '1.20.1') {
            java {
                srcDir(project(':common').file("src/compat/${commonCompatBucket}/java"))
            }
        } else if (commonCompatBucket == '1.20.3-1.20.4') {
            java {
                exclude { details ->
                    details.file.canonicalFile == project(':common').file('src/main/java/org/developerkubilay/safra/p2p/P2pClientProxy.java').canonicalFile
                }
                srcDir(project(':common').file("src/compat/${commonCompatBucket}/java"))
            }
        }
    }
}

def forgeCompatBucket = (rootProject.ext.forge_bucket ?: '').toString()
if (!forgeCompatBucket.isBlank()) {
    def forgeCompatRoots = [
        project.file('src/main/java/org/developerkubilay/safra/client/p2p').canonicalFile,
        project.file('src/main/java/org/developerkubilay/safra/mixin/client').canonicalFile
    ]
    sourceSets.main.java {
        exclude { details -> forgeCompatRoots.any { root -> details.file.canonicalPath.startsWith(root.canonicalPath) } }
        srcDir("compat/${forgeCompatBucket}/src/main/java")
    }
}

base {
    archivesName = "${project.archives_base_name}-forge"
}

def modDescription = rootProject.ext.selected_mc_profile == '1.20.3'
    ? 'Forge 1.20.3 ve 1.20.4 tarafini simdilik rafa kaldirdik. Duzelecek, ama bu buildde destek acik degil.'
    : project.mod_description

def devUsername = rootProject.ext.devRunUsername(project)
def forceDirectThenTurn = rootProject.ext.devBooleanProperty('forceDirectThenTurn')
def rootRunClientRequested = gradle.startParameter.taskNames.any {
    it.equalsIgnoreCase('runClient') || it.equalsIgnoreCase(':runClient')
}
def runningFromRootDir = gradle.startParameter.currentDir?.canonicalFile == rootProject.projectDir.canonicalFile
def forgeSupportOnly = rootRunClientRequested && runningFromRootDir

def targetJavaVersion = rootProject.ext.java_target_version as int
def sourceMixinMappingsFile = layout.buildDirectory.file('mappings/formatMixinMappings.tsrg')
def mixinRefmapFile = layout.buildDirectory.file('mixin/main.refmap.json')
def mixinMappingsFile = layout.buildDirectory.file('mixin/main.tsrg')
def identityMixinMappingsFile = layout.buildDirectory.file('mappings/identityMixinMappings.tsrg')
def compileJavaRefmapFile = layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')
def modernNamedForgeProfile = rootProject.ext.selected_mc_profile == '1.20.5-1.20.6'
def mixinCompilerArgs = objects.newInstance(SafraMixinCompilerArgs)

if (modernNamedForgeProfile) {
    mixinCompilerArgs.inMappings.set(identityMixinMappingsFile)
    mixinCompilerArgs.outMappings.set(mixinMappingsFile)
    mixinCompilerArgs.refmap.set(mixinRefmapFile)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('generateForgeIdentityMixinMappings') {
    dependsOn(tasks.named('formatMixinMappings'))
    inputs.file(sourceMixinMappingsFile)
    outputs.file(identityMixinMappingsFile)
    onlyIf { modernNamedForgeProfile }

    doLast {
        def sourceFile = sourceMixinMappingsFile.get().asFile
        def outputFile = identityMixinMappingsFile.get().asFile
        outputFile.parentFile.mkdirs()

        outputFile.setText(sourceFile.readLines('UTF-8').collect { line ->
            if (line.isBlank()) {
                return line
            }

            if (!line.startsWith('\t')) {
                def parts = line.split(' ')
                return parts.length == 2 ? "${parts[0]} ${parts[0]}" : line
            }

            def parts = line.trim().split(' ')
            if (parts.length == 2) {
                return "\t${parts[0]} ${parts[0]}"
            }
            if (parts.length == 3) {
                return "\t${parts[0]} ${parts[1]} ${parts[0]}"
            }
            return line
        }.join(System.lineSeparator()), 'UTF-8')
    }
}

tasks.named('compileJava', JavaCompile).configure {
    if (modernNamedForgeProfile) {
        dependsOn tasks.named('generateForgeIdentityMixinMappings')
        options.compilerArgumentProviders.add(mixinCompilerArgs)
        outputs.file(mixinRefmapFile)
        outputs.file(mixinMappingsFile)
    }
}

renamer.enableMixinRefmaps {
    config "${project.mod_id}.forge.mixins.json"
}

renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = 'srg'
    mappings renamer.mixin.generatedMappings
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            args "--mixin.config=${project.mod_id}.forge.mixins.json"
        }

        if (!forgeSupportOnly) {
            register('client') {
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
                systemProperty 'io.netty.transport.noNative', 'true'
                systemProperty 'java.net.preferIPv4Stack', 'false'
                systemProperty 'safra.p2p.diagnostics', 'true'
                if (forceDirectThenTurn) {
                    systemProperty 'safra.p2p.forceDirectThenTurn', 'true'
                }
                args '--username', devUsername
            }

            register('server') {
                args '--nogui'
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}


dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

renamer.mappings(minecraft.dependency.toSrg)

def forgeRuntimeJarName = "${project.archives_base_name}-forge-${project.version}.jar"
def forgeDevJarName = "${project.archives_base_name}-forge-${project.version}-dev.jar"
def forgeRemappedJarName = "${project.archives_base_name}-forge-${project.version}-srg.jar"
def forgeRemappedJarFile = layout.buildDirectory.file("minecraftforge/renamer/renamed/${forgeRemappedJarName}")

tasks.register('prepareForgeRuntimeJar') {
    dependsOn(tasks.named('renameJar'))
    inputs.file(forgeRemappedJarFile)
    outputs.file(layout.buildDirectory.file("libs/${forgeRuntimeJarName}"))
    outputs.file(layout.buildDirectory.file("libs/${forgeDevJarName}"))

    doLast {
        def libsDir = layout.buildDirectory.dir('libs').get().asFile
        def runtimeJar = new File(libsDir, forgeRuntimeJarName)
        def devJar = new File(libsDir, forgeDevJarName)
        def remappedJar = forgeRemappedJarFile.get().asFile

        if (!remappedJar.isFile()) {
            throw new GradleException("Missing remapped Forge jar: ${remappedJar}")
        }

        if (devJar.exists() && !devJar.delete()) {
            throw new GradleException("Could not delete stale Forge dev jar: ${devJar}")
        }

        if (!runtimeJar.isFile()) {
            throw new GradleException("Missing Forge runtime jar: ${runtimeJar}")
        }

        copy {
            from(runtimeJar)
            into(libsDir)
            rename { forgeDevJarName }
        }
    }
}

tasks.register('normalizeForgeMixinRefmaps') {
    dependsOn(tasks.named('prepareForgeRuntimeJar'))
    inputs.file(sourceMixinMappingsFile)
    inputs.files(
        layout.buildDirectory.file("libs/${forgeRuntimeJarName}"),
        layout.buildDirectory.file("libs/${forgeDevJarName}"),
        forgeRemappedJarFile
    )
    outputs.files(
        layout.buildDirectory.file("libs/${forgeRuntimeJarName}"),
        layout.buildDirectory.file("libs/${forgeDevJarName}"),
        forgeRemappedJarFile
    )

    doLast {
        if (modernNamedForgeProfile) {
            return
        }

        def methodMappings = [:]
        def fieldMappings = [:]
        def currentOwner = null

        sourceMixinMappingsFile.get().asFile.eachLine('UTF-8') { line ->
            if (line.isBlank()) {
                return
            }

            if (!line.startsWith('\t')) {
                def parts = line.split(' ')
                currentOwner = parts.length >= 1 ? parts[0] : null
                return
            }

            if (currentOwner == null) {
                return
            }

            def parts = line.trim().split(' ')
            if (parts.length == 2) {
                fieldMappings["L${currentOwner};${parts[0]}"] = "L${currentOwner};${parts[1]}"
            } else if (parts.length == 3) {
                methodMappings["L${currentOwner};${parts[0]}${parts[1]}"] = "L${currentOwner};${parts[2]}${parts[1]}"
            }
        }

        def remapValue
        remapValue = { value ->
            if (value instanceof Map) {
                return value.collectEntries { key, entry -> [key, remapValue(entry)] }
            }
            if (value instanceof List) {
                return value.collect { entry -> remapValue(entry) }
            }
            if (!(value instanceof String)) {
                return value
            }

            def remapped = value
            methodMappings.each { from, to ->
                remapped = remapped.replace(from, to)
            }
            fieldMappings.each { from, to ->
                remapped = remapped.replace(from, to)
            }
            return remapped
        }

        [
            layout.buildDirectory.file("libs/${forgeRuntimeJarName}").get().asFile,
            layout.buildDirectory.file("libs/${forgeDevJarName}").get().asFile,
            forgeRemappedJarFile.get().asFile
        ].findAll { it.isFile() }.each { jarFile ->
            def zipFile = java.nio.file.Path.of(jarFile.absolutePath)
            def zipUri = java.net.URI.create("jar:${zipFile.toUri()}")
            java.nio.file.FileSystems.newFileSystem(zipUri, [:]).withCloseable { zipFs ->
                def refmapPath = zipFs.getPath('/main.refmap.json')
                if (!java.nio.file.Files.exists(refmapPath)) {
                    throw new GradleException("Missing refmap main.refmap.json in ${jarFile.name}")
                }

                def refmap = new groovy.json.JsonSlurper().parse(java.nio.file.Files.newBufferedReader(refmapPath))
                def normalized = remapValue(refmap)
                java.nio.file.Files.writeString(
                    refmapPath,
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(normalized)),
                    java.nio.charset.StandardCharsets.UTF_8,
                    java.nio.file.StandardOpenOption.TRUNCATE_EXISTING
                )
            }
        }
    }
}

tasks.named('assemble') {
    dependsOn(tasks.named('normalizeForgeMixinRefmaps'))
}

tasks.named('build') {
    dependsOn(tasks.named('normalizeForgeMixinRefmaps'))
}

processResources {
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'forge_minecraft_version_range', project.forge_minecraft_version_range
    inputs.property 'forge_loader_version_range', project.forge_loader_version_range
    inputs.property 'forge_version_range', project.forge_version_range
    inputs.property 'forge_version', project.forge_version
    inputs.property 'loader_name', 'forge'
    inputs.property 'mod_id', project.mod_id
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_license', project.mod_license
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mod_description', modDescription
    inputs.property 'test_mode', rootProject.ext.buildTestMode
    filteringCharset = 'UTF-8'

    filesMatching('META-INF/mods.toml') {
        expand(
            minecraft_version: project.minecraft_version,
            forge_minecraft_version_range: project.forge_minecraft_version_range,
            forge_loader_version_range: project.forge_loader_version_range,
            forge_version_range: project.forge_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_description: modDescription
        )
    }

    filesMatching('safra-build.properties') {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_name: 'forge',
            loader_version: project.forge_version,
            test_mode: rootProject.ext.buildTestMode
        )
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    if (modernNamedForgeProfile) {
        from(compileJavaRefmapFile) {
            rename { 'main.refmap.json' }
        }
    }
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes['MixinConfigs'] = "${project.mod_id}.forge.mixins.json"
    }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = "${project.archives_base_name}-forge"
            from components.java
        }
    }

    repositories {
    }
}
