plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.23,8.0)'
    id 'net.minecraftforge.renamer' version '1.0.14'
}

sourceSets {
    main {
        java.srcDir(project(':common').file('src/main/java'))
        resources.srcDir(project(':common').file('src/main/resources'))
        if (project.selected_mc_profile == '1.17.1') {
            java.srcDir('src/forge1171/java')
            java.exclude('org/developerkubilay/safra/server/DedicatedP2pServerManager.java')
            java.exclude('org/developerkubilay/safra/server/SafraForgeServerEvents.java')
        } else if (project.selected_mc_profile in ['1.18', '1.18.1', '1.18.2', '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4']) {
            java.srcDir('src/forge118plus/java')
            java.exclude('org/developerkubilay/safra/server/DedicatedP2pServerManager.java')
            java.exclude('org/developerkubilay/safra/server/SafraForgeServerEvents.java')
        }
    }
}

base {
    archivesName = "${project.archives_base_name}-forge"
}

def devUsername = rootProject.ext.devRunUsername(project)
def forceDirectThenTurn = rootProject.ext.devBooleanProperty('forceDirectThenTurn')

def targetJavaVersion = rootProject.ext.java_target_version as int

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

renamer.enableMixinRefmaps {
    config "${project.mod_id}.forge.mixins.json"
}

renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = 'srg'
    mappings renamer.mixin.generatedMappings
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            args "--mixin.config=${project.mod_id}.forge.mixins.json"
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'io.netty.transport.noNative', 'true'
            systemProperty 'java.net.preferIPv4Stack', 'false'            if (forceDirectThenTurn) {
                systemProperty 'safra.p2p.forceDirectThenTurn', 'true'
            }
            args '--username', devUsername
        }

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

renamer.mappings(minecraft.dependency.toSrg)

def forgeRuntimeJarName = "${project.archives_base_name}-forge-${project.version}.jar"
def forgeDevJarName = "${project.archives_base_name}-forge-${project.version}-dev.jar"
def forgeRemappedJarName = "${project.archives_base_name}-forge-${project.version}-srg.jar"
def forgeRemappedJarFile = layout.buildDirectory.file("minecraftforge/renamer/renamed/${forgeRemappedJarName}")

tasks.register('prepareForgeRuntimeJar') {
    dependsOn(tasks.named('renameJar'))
    inputs.file(forgeRemappedJarFile)
    outputs.file(layout.buildDirectory.file("libs/${forgeRuntimeJarName}"))
    outputs.file(layout.buildDirectory.file("libs/${forgeDevJarName}"))

    doLast {
        def libsDir = layout.buildDirectory.dir('libs').get().asFile
        def runtimeJar = new File(libsDir, forgeRuntimeJarName)
        def devJar = new File(libsDir, forgeDevJarName)
        def remappedJar = forgeRemappedJarFile.get().asFile

        if (!remappedJar.isFile()) {
            throw new GradleException("Missing remapped Forge jar: ${remappedJar}")
        }

        if (devJar.exists() && !devJar.delete()) {
            throw new GradleException("Could not delete stale Forge dev jar: ${devJar}")
        }

        if (runtimeJar.isFile()) {
            if (!runtimeJar.renameTo(devJar)) {
                copy {
                    from(runtimeJar)
                    into(libsDir)
                    rename { forgeDevJarName }
                }
                if (!runtimeJar.delete()) {
                    throw new GradleException("Could not replace Forge runtime jar: ${runtimeJar}")
                }
            }
        }

        copy {
            from(remappedJar)
            into(libsDir)
            rename { forgeRuntimeJarName }
        }
    }
}

tasks.named('assemble') {
    dependsOn(tasks.named('prepareForgeRuntimeJar'))
}

tasks.named('build') {
    dependsOn(tasks.named('prepareForgeRuntimeJar'))
}

processResources {
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'forge_minecraft_version_range', project.forge_minecraft_version_range
    inputs.property 'forge_loader_version_range', project.forge_loader_version_range
    inputs.property 'forge_version_range', project.forge_version_range
    inputs.property 'mod_id', project.mod_id
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_license', project.mod_license
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mod_description', project.mod_description
    inputs.property 'mixin_compatibility_level', project.mixin_compatibility_level
    inputs.property 'test_mode', rootProject.ext.buildTestMode
    filteringCharset = 'UTF-8'

    filesMatching('META-INF/mods.toml') {
        expand(
            minecraft_version: project.minecraft_version,
            forge_minecraft_version_range: project.forge_minecraft_version_range,
            forge_loader_version_range: project.forge_loader_version_range,
            forge_version_range: project.forge_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_description: project.mod_description
        )
    }

    filesMatching('safra-build.properties') {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_name: 'forge',
            loader_version: project.forge_version,
            test_mode: rootProject.ext.buildTestMode
        )
    }

    filesMatching('safra.forge.mixins.json') {
        expand(
            mixin_compatibility_level: project.mixin_compatibility_level
        )
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes['MixinConfigs'] = "${project.mod_id}.forge.mixins.json"
    }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = "${project.archives_base_name}-forge"
            from components.java
        }
    }

    repositories {
    }
}
