plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

sourceSets {
    main {
        java.srcDir(project(':common').file('src/main/java'))
        resources.srcDir(project(':common').file('src/main/resources'))
    }
}

base {
    archivesName = "${project.archives_base_name}-forge"
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

def devUsername = rootProject.ext.devRunUsername(project)
def forceTurn = rootProject.ext.devBooleanProperty('forceTurn')

def targetJavaVersion = 17

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'snapshot', version: '20210309-1.16.5'

    runs {
        client {
            property 'safra.p2p.diagnostics', 'true'
            workingDirectory project.file('run')
            arg '--username'
            arg devUsername
            arg '-mixin.config=safra.forge.mixins.json'

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Minecraft Libraries'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    embed('org.slf4j:slf4j-api:1.7.36') {
        transitive = false
    }
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

processResources {
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'forge_minecraft_version_range', project.forge_minecraft_version_range
    inputs.property 'forge_loader_version_range', project.forge_loader_version_range
    inputs.property 'forge_version', project.forge_version
    inputs.property 'forge_version_range', project.forge_version_range
    inputs.property 'loader_name', 'forge'
    inputs.property 'mod_id', project.mod_id
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_license', project.mod_license
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mod_description', project.mod_description
    filteringCharset = 'UTF-8'

    filesMatching('META-INF/mods.toml') {
        expand(
            minecraft_version: project.minecraft_version,
            forge_minecraft_version_range: project.forge_minecraft_version_range,
            forge_loader_version_range: project.forge_loader_version_range,
            forge_version_range: project.forge_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_description: project.mod_description
        )
    }

    filesMatching('safra-build.properties') {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_name: 'forge',
            loader_version: project.forge_version
        )
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes['MixinConfigs'] = "${project.mod_id}.forge.mixins.json"
    }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = "${project.archives_base_name}-forge"
            from components.java
        }
    }

    repositories {
    }
}
