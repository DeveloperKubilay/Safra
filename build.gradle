import groovy.json.JsonSlurper

plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group = project.maven_group
version = "${project.minecraft_version}-${project.mod_version}"

base {
    archivesName = project.archives_base_name
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs = [
                'common/src/main/java',
                'forge/src/main/java'
            ]
            exclude 'org/developerkubilay/safra/mixin/**'
            exclude 'org/developerkubilay/safra/voicechat/**'
            exclude 'org/developerkubilay/safra/p2p/SafraVoiceClientSocket.java'
            exclude 'org/developerkubilay/safra/p2p/SafraVoiceServerSocket.java'
            exclude 'org/developerkubilay/safra/p2p/SafraPassthroughVoiceClientSocket.java'
            exclude 'org/developerkubilay/safra/p2p/SafraRawUdpPacket.java'
        }
        resources {
            srcDirs = [
                'common/src/main/resources',
                'forge/src/main/resources'
            ]
            exclude 'safra.forge.mixins.json'
            exclude 'META-INF/mods.toml'
        }
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

minecraft {
    mappings channel: project.mcp_mappings_channel, version: "${project.mcp_mappings_version}-1.12"
    runs {
        client {
            workingDirectory project.file('run')
            jvmArg '-Dsafra.p2p.diagnostics=true'
            args '--username', 'SafraDev'
        }
        server {
            workingDirectory project.file('run')
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    embed("org.java-websocket:Java-WebSocket:${project.java_websocket_version}") {
        transitive = false
    }
    embed("org.slf4j:slf4j-api:1.7.25") {
        transitive = false
    }
}

def generatedLegacyLangDir = layout.buildDirectory.dir('generated/resources/legacyLang')

String escapeLegacyLangValue(String value) {
    return value
        .replace('\\', '\\\\')
        .replace('\r', '')
        .replace('\n', '\\n')
}

tasks.register('generateLegacyLang') {
    inputs.files(fileTree('common/src/main/resources/assets/safra/lang') {
        include '*.json'
    })
    outputs.dir(generatedLegacyLangDir)

    doLast {
        File outputRoot = generatedLegacyLangDir.get().asFile
        delete(outputRoot)

        fileTree('common/src/main/resources/assets/safra/lang').matching {
            include '*.json'
        }.files.sort { it.name }.each { File jsonFile ->
            Map<String, Object> entries = new JsonSlurper().parse(jsonFile) as Map<String, Object>
            File langFile = new File(outputRoot, "assets/safra/lang/${jsonFile.name.replace('.json', '.lang')}")
            langFile.parentFile.mkdirs()
            String content = entries.collect { String key, Object value ->
                "${key}=${escapeLegacyLangValue(String.valueOf(value))}"
            }.join(System.lineSeparator()) + System.lineSeparator()
            langFile.setText(content, 'UTF-8')
        }
    }
}

processResources {
    dependsOn tasks.named('generateLegacyLang')
    inputs.property 'mod_id', project.mod_id
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mod_description', project.mod_description

    from(generatedLegacyLangDir)

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand(
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_version: project.mod_version,
            mod_description: project.mod_description,
            minecraft_version: project.minecraft_version
        )
    }

    filesMatching('safra-build.properties') {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_name: 'forge',
            loader_version: project.forge_version
        )
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes(
            'Implementation-Title': project.mod_name,
            'Implementation-Version': project.version
        )
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaExec).configureEach {
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    })
}
