def requestedMcProfile = (
    gradle.startParameter.projectProperties['mc_profile']
        ?: findProperty('mc_profile')
        ?: findProperty('default_mc_profile')
        ?: '1.16.5'
).toString()
def selectedMcProfile = ext.mcProfiles[requestedMcProfile]
if (selectedMcProfile == null) {
    throw new GradleException("Unknown mc_profile '${requestedMcProfile}'. Supported profiles: ${ext.mcProfiles.keySet().join(', ')}")
}

selectedMcProfile.each { key, value ->
    ext.set(key, value)
}
ext.set('selected_mc_profile', requestedMcProfile)
ext.set('build_directory_suffix', requestedMcProfile.replaceAll('[^0-9A-Za-z.-]+', '_'))
layout.buildDirectory.set(file("build/${ext.build_directory_suffix}/root"))

group = project.maven_group
version = "${ext.release_minecraft_line}-${project.mod_version}"
def rootRunClientRequested = gradle.startParameter.taskNames.any { it == 'runClient' || it == ':runClient' }

ext.devRunUsername = { Project targetProject ->
    def override = gradle.startParameter.projectProperties['devUsername']
    if (override != null && !override.isBlank()) {
        return override
    }

    def baseByProject = [
        fabric  : 100,
        forge   : 700
    ]
    int base = baseByProject.get(targetProject.name, 100)
    long seed = System.currentTimeMillis() ^ (targetProject.path.hashCode() * 31L)
    int offset = Math.floorMod((int) seed, 300)
    return "Player${base + offset}"
}

ext.devBooleanProperty = { String name ->
    def value = gradle.startParameter.projectProperties[name]
    return value != null && Boolean.parseBoolean(value)
}
ext.buildTestMode = {
    def normalize = { Object raw ->
        def value = raw == null ? '' : raw.toString().trim()
        if (value.isEmpty()) {
            return 'off'
        }

        def normalized = value.toLowerCase(Locale.ROOT)
        if (normalized == 'off' || normalized == 'forceturn' || normalized == 'directthenturn') {
            return normalized
        }

        throw new GradleException("Unsupported build test mode '${value}'. Supported values: off, forceTurn, directThenTurn")
    }

    def explicitMode = gradle.startParameter.projectProperties['build_mode']
        ?: findProperty('build_mode')
    if (explicitMode != null) {
        return normalize(explicitMode)
    }

    if (ext.devBooleanProperty('forceDirectThenTurn')) {
        return 'directthenturn'
    }

    if (ext.devBooleanProperty('forceTurn')) {
        return 'forceturn'
    }

    return 'off'
}.call()
allprojects {
    group = rootProject.group
    version = rootProject.version
}
subprojects {
    rootProject.ext.properties.findAll { key, value ->
        key in [
            'selected_mc_profile',
            'release_minecraft_line',
            'build_directory_suffix',
            'minecraft_version',
            'yarn_mappings',
            'loader_version',
            'fabric_version',
            'minecraft_version_range',
            'forge_version',
            'forge_mappings',
            'forge_version_range',
            'forge_loader_version_range',
            'forge_minecraft_version_range'
        ]
    }.each { key, value ->
        ext.set(key, value)
    }

    layout.buildDirectory.set(rootProject.file("build/${rootProject.ext.build_directory_suffix}/${project.name}"))

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'MaxHenkel'
            url = 'https://maven.maxhenkel.de/repository/public'
        }
    }
}

def fabricProject = findProject(':fabric')
def forgeProject = findProject(':forge')

forgeProject?.tasks?.matching { it.name == 'runClient' }?.configureEach {
    onlyIf { !rootRunClientRequested }
}

tasks.register('collectBuildLibs', Copy) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    into(layout.buildDirectory.dir('libs'))
    include("*-${project.version}.jar", "*-${project.version}-sources.jar")

    if (fabricProject != null) {
        dependsOn(':fabric:build')
        from(fabricProject.layout.buildDirectory.dir('libs'))
    }
    if (forgeProject != null) {
        dependsOn(':forge:build')
        from(forgeProject.layout.buildDirectory.dir('libs'))
    }

    doFirst {
        delete(layout.buildDirectory.dir('libs').get().asFile)
    }
    doLast {
        if (forgeProject == null) {
            return
        }

        def rootLibsDir = layout.buildDirectory.dir('libs').get().asFile
        def rootForgeJar = new File(rootLibsDir, "${project.archives_base_name}-forge-${project.version}.jar")
        def forgeDevJar = forgeProject.layout.buildDirectory.file("libs/${project.archives_base_name}-forge-${project.version}-dev.jar").get().asFile

        if (!forgeDevJar.isFile()) {
            return
        }

        if (rootForgeJar.exists() && !rootForgeJar.delete()) {
            throw new GradleException("Could not replace root Forge jar: ${rootForgeJar}")
        }

        copy {
            from(forgeDevJar)
            into(rootLibsDir)
            rename { "${project.archives_base_name}-forge-${project.version}.jar" }
        }
    }
}

tasks.register('runClient') {
    group = 'application'
    description = 'Runs the available client from the root project.'
    if (fabricProject != null) {
        dependsOn(':fabric:runClient')
    } else if (forgeProject != null) {
        dependsOn(':forge:runClient')
    }
}

tasks.named('build') {
    dependsOn(tasks.named('collectBuildLibs'))
}

def releaseTaskNames = []
ext.mcProfiles.each { profileName, profileConfig ->
    def taskName = "buildRelease${profileName.replace('.', '').replace('-', '').replaceAll('[^0-9A-Za-z]', '')}"
    releaseTaskNames << taskName
    tasks.register(taskName, Exec) {
        group = 'release'
        description = "Builds the ${profileName} release line."
        workingDir rootProject.projectDir
        def wrapperExecutable = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('win') ? 'gradlew.bat' : './gradlew'
        commandLine(wrapperExecutable, 'clean', 'build', '--no-daemon', '--console=plain', "-Pmc_profile=${profileName}")
    }
}

tasks.register('buildReleaseMatrix') {
    group = 'release'
    description = 'Builds every configured Minecraft release line.'
    dependsOn(releaseTaskNames.collect { tasks.named(it) })
}
