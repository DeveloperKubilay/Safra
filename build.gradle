    ext.forge_version = rootProject.ext.activeVersion.forgeVersion
    ext.forge_version_range = rootProject.ext.activeVersion.forgeVersionRange
    ext.forge_loader_version_range = rootProject.ext.activeVersion.forgeLoaderVersionRange
    ext.forge_minecraft_version_range = rootProject.ext.activeVersion.forgeMinecraftVersionRange
    ext.versionSourceDir = rootProject.ext.versionSourceDir
