def requestedMcVersion = (
    gradle.startParameter.projectProperties['mcVersion']
        ?: findProperty('mcVersion')
        ?: gradle.startParameter.projectProperties['minecraft_version']
        ?: findProperty('minecraft_version')
        ?: findProperty('base_minecraft_version')
        ?: '26.1.1'
).toString()
def activeVersion = versionConfig[requestedMcVersion]
if (activeVersion == null) {
    throw new GradleException("Unknown mcVersion '${requestedMcVersion}'. Supported versions: ${versionConfig.keySet().join(', ')}")
}

ext.mcVersion = requestedMcVersion
ext.activeVersion = activeVersion
ext.versionConfig = versionConfig
ext.supportedMcVersions = versionConfig.keySet() as List
ext.buildDirectorySuffix = requestedMcVersion.replaceAll('[^0-9A-Za-z.-]+', '_')
layout.buildDirectory.set(file("build/${ext.buildDirectorySuffix}/root"))

group = project.maven_group
version = "${requestedMcVersion}-${project.mod_version}"

ext.devRunUsername = { Project targetProject ->
    def override = gradle.startParameter.projectProperties['devUsername']
    if (override != null && !override.isBlank()) {
        return override
    }

    def baseByProject = [
        fabric  : 100,
        neoforge: 400,
        forge   : 700
    ]
    int base = baseByProject.get(targetProject.name, 100)
    long seed = System.currentTimeMillis() ^ (targetProject.path.hashCode() * 31L)
    int offset = Math.floorMod((int) seed, 300)
    return "Player${base + offset}"
}

ext.devBooleanProperty = { String name ->
    def value = gradle.startParameter.projectProperties[name]
    return value != null && Boolean.parseBoolean(value)
}

ext.buildTestMode = {
    def normalize = { Object raw ->
        def value = raw == null ? '' : raw.toString().trim()
        if (value.isEmpty()) {
            return 'off'
        }

        def normalized = value.toLowerCase(Locale.ROOT)
        if (normalized == 'off' || normalized == 'directthenturn' || normalized == 'hostfailsafe') {
            return normalized
        }

        throw new GradleException("Unsupported build test mode '${value}'. Supported values: off, directThenTurn, hostFailSafe")
    }

    def explicitMode = gradle.startParameter.projectProperties['build_mode']
        ?: findProperty('build_mode')
    if (explicitMode != null) {
        return normalize(explicitMode)
    }

    if (ext.devBooleanProperty('forceDirectThenTurn')) {
        return 'directthenturn'
    }

    return 'off'
}.call()

allprojects {
    group = rootProject.group
    version = rootProject.version
}

subprojects {
    ext.base_minecraft_version = rootProject.ext.activeVersion.base_minecraft_version
    ext.fabric_minecraft_version = rootProject.ext.activeVersion.fabric_minecraft_version
    ext.fabric_mod_minecraft_version = rootProject.ext.activeVersion.fabric_mod_minecraft_version
    ext.fabric_version = rootProject.ext.activeVersion.fabric_version
    ext.minecraft_version = rootProject.ext.activeVersion.minecraft_version
    ext.minecraft_version_range = rootProject.ext.activeVersion.minecraft_version_range
    ext.neo_version = rootProject.ext.activeVersion.neo_version
    ext.neo_version_range = rootProject.ext.activeVersion.neo_version_range
    ext.loader_version_range = rootProject.ext.activeVersion.loader_version_range
    ext.forge_version = rootProject.ext.activeVersion.forge_version
    ext.forge_version_range = rootProject.ext.activeVersion.forge_version_range
    ext.forge_loader_version_range = rootProject.ext.activeVersion.forge_loader_version_range
    ext.forge_minecraft_version_range = rootProject.ext.activeVersion.forge_minecraft_version_range
    ext.build_directory_suffix = rootProject.ext.buildDirectorySuffix

    layout.buildDirectory.set(rootProject.file("build/${rootProject.ext.buildDirectorySuffix}/${project.name}"))

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MaxHenkel'
            url = 'https://maven.maxhenkel.de/repository/public'
            content {
                includeGroup 'de.maxhenkel.voicechat'
            }
        }
    }
}

def fabricProject = findProject(':fabric')
def neoforgeProject = findProject(':neoforge')
def forgeProject = findProject(':forge')
def rootRunClientRequested = gradle.startParameter.taskNames.any {
    it.equalsIgnoreCase('runClient') || it.equalsIgnoreCase(':runClient')
}
def runningFromRootDir = gradle.startParameter.currentDir?.canonicalFile == rootProject.projectDir.canonicalFile
def rootTaskSelectorRunClient = rootRunClientRequested && runningFromRootDir
def wrapperExecutable = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('win') ? 'gradlew.bat' : './gradlew'
def forwardedProjectProperties = gradle.startParameter.projectProperties.collect { key, value ->
    value == null || value.isBlank() ? "-P${key}" : "-P${key}=${value}"
}

fabricProject?.tasks?.matching { it.name == 'runClient' }?.configureEach {
    onlyIf { !rootTaskSelectorRunClient }
}
neoforgeProject?.tasks?.matching { it.name == 'runClient' }?.configureEach {
    onlyIf { !rootTaskSelectorRunClient }
}
forgeProject?.tasks?.matching { it.name == 'runClient' }?.configureEach {
    onlyIf { !rootTaskSelectorRunClient }
}

tasks.register('collectBuildLibs', Copy) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    into(layout.buildDirectory.dir('libs'))
    include("*-${project.version}.jar", "*-${project.version}-sources.jar")

    if (fabricProject != null) {
        dependsOn(':fabric:build')
        from(fabricProject.layout.buildDirectory.dir('libs'))
    }
    if (neoforgeProject != null) {
        dependsOn(':neoforge:build')
        from(neoforgeProject.layout.buildDirectory.dir('libs'))
    }
    if (forgeProject != null) {
        dependsOn(':forge:build')
        from(forgeProject.layout.buildDirectory.dir('libs'))
    }

    doFirst {
        delete(layout.buildDirectory.dir('libs').get().asFile)
    }
}

tasks.register('runClient', Exec) {
    group = 'application'
    description = 'Runs the NeoForge client from the root project.'
    workingDir rootProject.projectDir
    if (neoforgeProject != null) {
        commandLine([wrapperExecutable, ':neoforge:runClient', '--no-daemon', '--console=plain'] + forwardedProjectProperties)
    } else if (fabricProject != null) {
        commandLine([wrapperExecutable, ':fabric:runClient', '--no-daemon', '--console=plain'] + forwardedProjectProperties)
    }
}

tasks.register('runFabricClient') {
    group = 'application'
    description = 'Runs the Fabric client from the root project.'
    if (fabricProject != null) {
        dependsOn(':fabric:runClient')
    }
}

tasks.register('runNeoForgeClient') {
    group = 'application'
    description = 'Runs the NeoForge client from the root project.'
    if (neoforgeProject != null) {
        dependsOn(':neoforge:runClient')
    }
}

tasks.register('runForgeClient') {
    group = 'application'
    description = 'Runs the Forge client from the root project.'
    if (forgeProject != null) {
        dependsOn(':forge:runClient')
    }
}

tasks.named('build') {
    doFirst {
        delete(layout.buildDirectory.file('reports/problems/problems-report.html').get().asFile)
    }
    dependsOn(tasks.named('collectBuildLibs'))
}

def releaseTaskNames = []
ext.supportedMcVersions.each { profileName ->
    def taskName = "buildRelease${profileName.replace('.', '').replace('-', '').replaceAll('[^0-9A-Za-z]', '')}"
    releaseTaskNames << taskName
    tasks.register(taskName, Exec) {
        group = 'release'
        description = "Builds the ${profileName} release line."
        workingDir rootProject.projectDir
        commandLine([wrapperExecutable, 'clean', 'build', '--no-daemon', '--console=plain'] + forwardedProjectProperties + [
            "-PmcVersion=${profileName}"
        ])
    }
}

tasks.register('buildReleaseMatrix') {
    group = 'release'
    description = 'Builds every configured Minecraft release line.'
    dependsOn(releaseTaskNames.collect { tasks.named(it) })
}

tasks.register('collectReleaseMatrixArtifacts') {
    group = 'release'
    description = 'Collects all built release artifacts into one folder tree.'
    dependsOn(tasks.named('buildReleaseMatrix'))

    doLast {
        def outputDir = rootProject.file("build/release-matrix/${project.mod_version}")
        delete(outputDir)
        outputDir.mkdirs()

        rootProject.ext.supportedMcVersions.each { profileName ->
            def versionLibDir = file("${rootProject.projectDir}/build/${profileName}/root/libs")
            if (!versionLibDir.exists()) {
                throw new GradleException("Missing built artifact directory for ${profileName}: ${versionLibDir}")
            }

            def targetDir = file("${outputDir}/${profileName}")
            targetDir.mkdirs()

            copy {
                from(versionLibDir)
                into(targetDir)
                include('*.jar')
                exclude('*-dev.jar', '*-srg.jar')
            }
        }
    }
}

tasks.register('verifyMixinArtifacts') {
    dependsOn(tasks.named('collectBuildLibs'))

    doLast {
        def jars = layout.buildDirectory.dir('libs').get().asFile.listFiles()?.findAll {
            it.name.endsWith('.jar') && !it.name.endsWith('-sources.jar')
        } ?: []
        if (jars.isEmpty()) {
            throw new GradleException('No built jars were found for mixin verification.')
        }

        def slurper = new JsonSlurper()
        def mixinConfigRequirements = [
            'safra.forge.mixins.json'   : 'forge',
            'safra.neoforge.mixins.json': 'neoforge'
        ]
        def modEntryClassName = 'org.developerkubilay.safra.SafraForge'
        def modEntryClassPath = 'org/developerkubilay/safra/SafraForge.class'
        def hasPublicNoArgConstructor = { byte[] classBytes ->
            def input = new DataInputStream(new ByteArrayInputStream(classBytes))
            try {
                if ((input.readInt() & 0xFFFFFFFFL) != 0xCAFEBABEL) {
                    throw new GradleException("Invalid class file for ${modEntryClassName}")
                }

                input.readUnsignedShort()
                input.readUnsignedShort()

                int constantPoolCount = input.readUnsignedShort()
                def constantPool = new Object[constantPoolCount]
                for (int index = 1; index < constantPoolCount; index++) {
                    switch (input.readUnsignedByte()) {
                        case 1:
                            constantPool[index] = input.readUTF()
                            break
                        case 3:
                        case 4:
                            input.readInt()
                            break
                        case 5:
                        case 6:
                            input.readLong()
                            index++
                            break
                        case 7:
                        case 8:
                        case 16:
                        case 19:
                        case 20:
                            input.readUnsignedShort()
                            break
                        case 9:
                        case 10:
                        case 11:
                        case 12:
                        case 17:
                        case 18:
                            input.readUnsignedShort()
                            input.readUnsignedShort()
                            break
                        case 15:
                            input.readUnsignedByte()
                            input.readUnsignedShort()
                            break
                        default:
                            throw new GradleException("Unsupported class file constant pool tag while checking ${modEntryClassName}")
                    }
                }

                input.readUnsignedShort()
                input.readUnsignedShort()
                input.readUnsignedShort()

                input.readUnsignedShort().times {
                    input.readUnsignedShort()
                }

                def skipMember = {
                    input.readUnsignedShort()
                    input.readUnsignedShort()
                    input.readUnsignedShort()
                    input.readUnsignedShort().times {
                        input.readUnsignedShort()
                        input.skipNBytes(input.readInt() as long)
                    }
                }

                input.readUnsignedShort().times {
                    skipMember()
                }

                int methodCount = input.readUnsignedShort()
                for (int methodIndex = 0; methodIndex < methodCount; methodIndex++) {
                    int accessFlags = input.readUnsignedShort()
                    int nameIndex = input.readUnsignedShort()
                    int descriptorIndex = input.readUnsignedShort()
                    String methodName = constantPool[nameIndex] as String
                    String descriptor = constantPool[descriptorIndex] as String
                    input.readUnsignedShort().times {
                        input.readUnsignedShort()
                        input.skipNBytes(input.readInt() as long)
                    }

                    if (methodName == '<init>' && descriptor == '()V' && (accessFlags & 0x0001) != 0) {
                        return true
                    }
                }

                return false
            } finally {
                input.close()
            }
        }

        jars.findAll { jarFile ->
            jarFile.name.contains('-forge-') || jarFile.name.contains('-neoforge-')
        }.each { jarFile ->
            JarFile jar = new JarFile(jarFile)
            try {
                mixinConfigRequirements.each { configName, loader ->
                    def configEntry = jar.getJarEntry(configName)
                    if (configEntry == null) {
                        return
                    }

                    def config = slurper.parse(jar.getInputStream(configEntry))
                    def refmapName = config.refmap
                    if (!(refmapName instanceof String) || refmapName.isBlank()) {
                        throw new GradleException("Missing refmap in ${jarFile.name}:${configName}")
                    }

                    def refmapEntry = jar.getJarEntry(refmapName)
                    if (refmapEntry == null) {
                        throw new GradleException("Missing refmap resource ${refmapName} in ${jarFile.name}")
                    }

                    def refmap = slurper.parse(jar.getInputStream(refmapEntry))
                    def hasMappings = refmap instanceof Map && (
                        (refmap.mappings instanceof Map && !refmap.mappings.isEmpty()) ||
                        (refmap.data instanceof Map && refmap.data.values().any { it instanceof Map && !it.isEmpty() })
                    )
                    if (!hasMappings) {
                        throw new GradleException("Empty refmap ${refmapName} in ${jarFile.name}")
                    }

                    if (loader == 'forge' || loader == 'neoforge') {
                        def serializedRefmap = groovy.json.JsonOutput.toJson(refmap)
                        if (serializedRefmap.contains(';m_') || serializedRefmap.contains(' f_')) {
                            throw new GradleException("${loader.capitalize()} refmap ${refmapName} in ${jarFile.name} still contains obfuscated member names.")
                        }
                    }
                }
                if (jarFile.name.contains('-forge-')) {
                    def modEntryClass = jar.getJarEntry(modEntryClassPath)
                    if (modEntryClass == null) {
                        throw new GradleException("Missing mod entrypoint class ${modEntryClassName} in ${jarFile.name}")
                    }
                    if (!hasPublicNoArgConstructor(jar.getInputStream(modEntryClass).bytes)) {
                        throw new GradleException("Missing public no-arg mod entrypoint constructor in ${jarFile.name}:${modEntryClassName}")
                    }
                }
            } finally {
                jar.close()
            }
        }
    }
}

tasks.named('build') {
    dependsOn(tasks.named('verifyMixinArtifacts'))
}
