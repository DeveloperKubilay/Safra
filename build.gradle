import groovy.json.JsonSlurper
import java.util.jar.JarFile

plugins {
    id 'base'
}

group = project.maven_group
version = "${project.base_minecraft_version}-${project.mod_version}"

ext.devRunUsername = { Project targetProject ->
    def override = gradle.startParameter.projectProperties['devUsername']
    if (override != null && !override.isBlank()) {
        return override
    }

    def baseByProject = [
        fabric  : 100,
        neoforge: 400,
        forge   : 700
    ]
    int base = baseByProject.get(targetProject.name, 100)
    long seed = System.currentTimeMillis() ^ (targetProject.path.hashCode() * 31L)
    int offset = Math.floorMod((int) seed, 300)
    return "Player${base + offset}"
}

ext.devBooleanProperty = { String name ->
    def value = gradle.startParameter.projectProperties[name]
    return value != null && Boolean.parseBoolean(value)
}
allprojects {
    group = rootProject.group
    version = rootProject.version
}

subprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MaxHenkel'
            url = 'https://maven.maxhenkel.de/repository/public'
        }
    }
}

project(':neoforge').tasks.matching { it.name == 'runClient' }.configureEach {
    onlyIf { !gradle.taskGraph.hasTask(':runClient') }
}

project(':forge').tasks.matching { it.name == 'runClient' }.configureEach {
    onlyIf { !gradle.taskGraph.hasTask(':runClient') }
}

tasks.register('collectBuildLibs', Copy) {
    dependsOn(':fabric:build', ':neoforge:build', ':forge:build')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(project(':fabric').layout.buildDirectory.dir('libs'))
    from(project(':neoforge').layout.buildDirectory.dir('libs'))
    from(project(':forge').layout.buildDirectory.dir('libs'))
    into(layout.buildDirectory.dir('libs'))
    include("*-${project.version}.jar", "*-${project.version}-sources.jar")

    doFirst {
        delete(layout.buildDirectory.dir('libs').get().asFile)
    }
    doLast {
        def launcherForgeProject = findProject(':forge')
        if (launcherForgeProject == null) {
            return
        }

        def rootLibsDir = layout.buildDirectory.dir('libs').get().asFile
        def rootForgeJar = new File(rootLibsDir, "${project.archives_base_name}-forge-${project.version}.jar")
        def forgeDevJar = launcherForgeProject.layout.buildDirectory.file("libs/${project.archives_base_name}-forge-${project.version}-dev.jar").get().asFile

        if (!forgeDevJar.isFile()) {
            return
        }

        if (rootForgeJar.exists() && !rootForgeJar.delete()) {
            throw new GradleException("Could not replace root Forge jar: ${rootForgeJar}")
        }

        copy {
            from(forgeDevJar)
            into(rootLibsDir)
            rename { "${project.archives_base_name}-forge-${project.version}.jar" }
        }
    }
}

tasks.register('runClient') {
    group = 'application'
    description = 'Runs the Fabric client from the root project.'
    dependsOn(':fabric:runClient')
}

tasks.named('build') {
    dependsOn(tasks.named('collectBuildLibs'))
}

tasks.register('verifyMixinArtifacts') {
    dependsOn(tasks.named('collectBuildLibs'))

    doLast {
        def jars = layout.buildDirectory.dir('libs').get().asFile.listFiles()?.findAll {
            it.name.endsWith('.jar') && !it.name.endsWith('-sources.jar')
        } ?: []
        if (jars.isEmpty()) {
            throw new GradleException('No built jars were found for mixin verification.')
        }

        def slurper = new JsonSlurper()
        def mixinConfigRequirements = [
            'safra.forge.mixins.json'   : 'forge',
            'safra.neoforge.mixins.json': 'neoforge'
        ]
        def modEntryClassName = 'org.developerkubilay.safra.SafraForge'
        def modEntryClassPath = 'org/developerkubilay/safra/SafraForge.class'
        def hasPublicNoArgConstructor = { byte[] classBytes ->
            def input = new DataInputStream(new ByteArrayInputStream(classBytes))
            try {
                if ((input.readInt() & 0xFFFFFFFFL) != 0xCAFEBABEL) {
                    throw new GradleException("Invalid class file for ${modEntryClassName}")
                }

                input.readUnsignedShort()
                input.readUnsignedShort()

                int constantPoolCount = input.readUnsignedShort()
                def constantPool = new Object[constantPoolCount]
                for (int index = 1; index < constantPoolCount; index++) {
                    switch (input.readUnsignedByte()) {
                        case 1:
                            constantPool[index] = input.readUTF()
                            break
                        case 3:
                        case 4:
                            input.readInt()
                            break
                        case 5:
                        case 6:
                            input.readLong()
                            index++
                            break
                        case 7:
                        case 8:
                        case 16:
                        case 19:
                        case 20:
                            input.readUnsignedShort()
                            break
                        case 9:
                        case 10:
                        case 11:
                        case 12:
                        case 17:
                        case 18:
                            input.readUnsignedShort()
                            input.readUnsignedShort()
                            break
                        case 15:
                            input.readUnsignedByte()
                            input.readUnsignedShort()
                            break
                        default:
                            throw new GradleException("Unsupported class file constant pool tag while checking ${modEntryClassName}")
                    }
                }

                input.readUnsignedShort()
                input.readUnsignedShort()
                input.readUnsignedShort()

                input.readUnsignedShort().times {
                    input.readUnsignedShort()
                }

                def skipMember = {
                    input.readUnsignedShort()
                    input.readUnsignedShort()
                    input.readUnsignedShort()
                    input.readUnsignedShort().times {
                        input.readUnsignedShort()
                        input.skipNBytes(input.readInt() as long)
                    }
                }

                input.readUnsignedShort().times {
                    skipMember()
                }

                int methodCount = input.readUnsignedShort()
                for (int methodIndex = 0; methodIndex < methodCount; methodIndex++) {
                    int accessFlags = input.readUnsignedShort()
                    int nameIndex = input.readUnsignedShort()
                    int descriptorIndex = input.readUnsignedShort()
                    String methodName = constantPool[nameIndex] as String
                    String descriptor = constantPool[descriptorIndex] as String
                    input.readUnsignedShort().times {
                        input.readUnsignedShort()
                        input.skipNBytes(input.readInt() as long)
                    }

                    if (methodName == '<init>' && descriptor == '()V' && (accessFlags & 0x0001) != 0) {
                        return true
                    }
                }

                return false
            } finally {
                input.close()
            }
        }

        jars.findAll { jarFile ->
            jarFile.name.contains('-forge-') || jarFile.name.contains('-neoforge-')
        }.each { jarFile ->
            JarFile jar = new JarFile(jarFile)
            try {
                mixinConfigRequirements.each { configName, loader ->
                    def configEntry = jar.getJarEntry(configName)
                    if (configEntry == null) {
                        return
                    }

                    def config = slurper.parse(jar.getInputStream(configEntry))
                    def refmapName = config.refmap
                    if (!(refmapName instanceof String) || refmapName.isBlank()) {
                        throw new GradleException("Missing refmap in ${jarFile.name}:${configName}")
                    }

                    def refmapEntry = jar.getJarEntry(refmapName)
                    if (refmapEntry == null) {
                        throw new GradleException("Missing refmap resource ${refmapName} in ${jarFile.name}")
                    }

                    def refmap = slurper.parse(jar.getInputStream(refmapEntry))
                    def hasMappings = refmap instanceof Map && (
                        (refmap.mappings instanceof Map && !refmap.mappings.isEmpty()) ||
                        (refmap.data instanceof Map && refmap.data.values().any { it instanceof Map && !it.isEmpty() })
                    )
                    if (!hasMappings) {
                        throw new GradleException("Empty refmap ${refmapName} in ${jarFile.name}")
                    }

                    if (loader == 'neoforge') {
                        def serializedRefmap = groovy.json.JsonOutput.toJson(refmap)
                        if (serializedRefmap.contains(';m_') || serializedRefmap.contains(' f_')) {
                            throw new GradleException("NeoForge refmap ${refmapName} in ${jarFile.name} still contains obfuscated member names.")
                        }
                    }
                }
                if (jarFile.name.contains('-forge-')) {
                    def modEntryClass = jar.getJarEntry(modEntryClassPath)
                    if (modEntryClass == null) {
                        throw new GradleException("Missing mod entrypoint class ${modEntryClassName} in ${jarFile.name}")
                    }
                    if (!hasPublicNoArgConstructor(jar.getInputStream(modEntryClass).bytes)) {
                        throw new GradleException("Missing public no-arg mod entrypoint constructor in ${jarFile.name}:${modEntryClassName}")
                    }
                }
            } finally {
                jar.close()
            }
        }
    }
}

tasks.named('build') {
    dependsOn(tasks.named('verifyMixinArtifacts'))
}
