import java.util.Locale

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Safra'

include 'common'

def taskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(Locale.ROOT) }
def currentDirName = gradle.startParameter.currentDir?.name?.toLowerCase(Locale.ROOT)
def touchesOnly = { List<String> prefixes ->
    !taskNames.isEmpty() && taskNames.every { name ->
        prefixes.any { prefix ->
            name == prefix || name == ":${prefix}" || name.startsWith("${prefix}:") || name.startsWith(":${prefix}:")
        } || name == 'runclient' || name == ':runclient'
    }
}

def autoFabricOnly = touchesOnly(['fabric', 'common'])
def autoNeoForgeOnly = !autoFabricOnly && touchesOnly(['neoforge', 'common'])
def autoForgeOnly = !(autoFabricOnly || autoNeoForgeOnly) && touchesOnly(['forge', 'common'])

def currentDirFabricOnly = currentDirName == 'fabric'
def currentDirNeoForgeOnly = currentDirName == 'neoforge'
def currentDirForgeOnly = currentDirName == 'forge'

def forceFabricOnly = gradle.startParameter.projectProperties.containsKey('fabricOnly')
def forceNeoForgeOnly = gradle.startParameter.projectProperties.containsKey('neoforgeOnly')
def forceForgeOnly = gradle.startParameter.projectProperties.containsKey('forgeOnly')

def includeFabric = !(forceNeoForgeOnly || forceForgeOnly || autoNeoForgeOnly || autoForgeOnly || currentDirNeoForgeOnly || currentDirForgeOnly)
def includeNeoForge = !(forceFabricOnly || forceForgeOnly || autoFabricOnly || autoForgeOnly || currentDirFabricOnly || currentDirForgeOnly)
def includeForge = !(forceFabricOnly || forceNeoForgeOnly || autoFabricOnly || autoNeoForgeOnly || currentDirFabricOnly || currentDirNeoForgeOnly)
def includeForgeSupport = includeNeoForge

if (includeFabric) {
    include 'fabric'
}
if (includeNeoForge) {
    include 'neoforge'
}
if (includeForge || includeForgeSupport) {
    include 'forge'
}
