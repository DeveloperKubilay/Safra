pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Safra'

include 'common'
include 'fabric'
include 'neoforge'
include 'forge'

def kwikSourceDir = file(providers.gradleProperty('kwikSourceDir').getOrElse('../kwik'))
if (!new File(kwikSourceDir, 'settings.gradle').isFile()) {
    throw new GradleException('Kwik sources are missing. Run: python tools/prepare_kwik.py')
}
includeBuild(kwikSourceDir) {
    dependencySubstitution {
        substitute module('tech.kwik:kwik') using project(':kwik')
    }
}
