pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
            content {
                includeGroupByRegex 'net\\.neoforged(\\..+)?'
                includeGroup 'cpw.mods'
            }
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Safra'

include 'common'
include 'fabric'

def localProperties = new Properties()
def localPropertiesFile = file('gradle.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def mcProfileDefaults = [
    '1.20'          : [enable_neoforge: 'false', enable_forge: 'true'],
    '1.20.1'        : [enable_neoforge: 'false', enable_forge: 'true'],
    '1.20.2'        : [enable_neoforge: 'false', enable_forge: 'true'],
    '1.20.3'        : [enable_neoforge: 'false', enable_forge: 'true'],
    '1.20.4'        : [enable_neoforge: 'true', enable_forge: 'true'],
    '1.20.5-1.20.6' : [enable_neoforge: 'true', enable_forge: 'true']
]

def selectedMcProfile = gradle.startParameter.projectProperties['mc_profile']
if (selectedMcProfile == null) {
    selectedMcProfile = localProperties.getProperty('default_mc_profile')
}

def enableForgeValue = gradle.startParameter.projectProperties['enable_forge']
if (enableForgeValue == null) {
    def profileDefaults = mcProfileDefaults[selectedMcProfile]
    if (profileDefaults != null && profileDefaults.enable_forge != null) {
        enableForgeValue = profileDefaults.enable_forge
    }
}
if (enableForgeValue == null) {
    enableForgeValue = localProperties.getProperty('enable_forge', 'true')
}
def forgeEnabled = Boolean.parseBoolean(enableForgeValue)

def enableNeoForgeValue = gradle.startParameter.projectProperties['enable_neoforge']
if (enableNeoForgeValue == null) {
    def profileDefaults = mcProfileDefaults[selectedMcProfile]
    if (profileDefaults != null) {
        enableNeoForgeValue = profileDefaults.enable_neoforge
    }
}
if (enableNeoForgeValue == null) {
    enableNeoForgeValue = localProperties.getProperty('enable_neoforge', 'true')
}
def neoForgeEnabled = Boolean.parseBoolean(enableNeoForgeValue)

if (forgeEnabled || neoForgeEnabled) {
    include 'forge'
}

if (neoForgeEnabled) {
    include 'neoforge'
}
