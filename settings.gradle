pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        gradlePluginPortal()
    }
}

import java.util.Locale

rootProject.name = 'Safra'

include 'common'

def localProperties = new Properties()
def localPropertiesFile = file('gradle.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def taskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(Locale.ROOT) }
def currentDirName = gradle.startParameter.currentDir?.name?.toLowerCase(Locale.ROOT)
def touchesOnly = { List<String> prefixes ->
    !taskNames.isEmpty() && taskNames.every { name ->
        prefixes.any { prefix ->
            name == prefix || name == ":${prefix}" || name.startsWith("${prefix}:") || name.startsWith(":${prefix}:")
        } || name == 'runclient' || name == ':runclient'
    }
}

def selectedMcProfile = gradle.startParameter.projectProperties['mc_profile']
if (selectedMcProfile == null || selectedMcProfile.isBlank()) {
    selectedMcProfile = localProperties.getProperty('default_mc_profile')
}

def autoFabricOnly = touchesOnly(['fabric', 'common'])
def autoForgeOnly = !autoFabricOnly && touchesOnly(['forge', 'common'])
def currentDirFabricOnly = currentDirName == 'fabric'
def currentDirForgeOnly = currentDirName == 'forge'
def forceFabricOnly = gradle.startParameter.projectProperties.containsKey('fabricOnly')
def forceForgeOnly = gradle.startParameter.projectProperties.containsKey('forgeOnly')

def includeFabric = !(forceForgeOnly || autoForgeOnly || currentDirForgeOnly)
def includeForge = !(forceFabricOnly || autoFabricOnly || currentDirFabricOnly)
if (includeFabric) {
    include 'fabric'
}
if (includeForge) {
    include 'forge'
}
