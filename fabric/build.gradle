plugins {
    id 'fabric-loom' version '0.12-SNAPSHOT'
    id 'maven-publish'
}

sourceSets {
    main {
        java.srcDir(project(':common').file('src/main/java'))
        resources.srcDir(project(':common').file('src/main/resources'))
        java.srcDir(file('src/client/java'))
        resources.srcDir(file('src/client/resources'))
    }
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

def devUsername = rootProject.ext.devRunUsername(project)
def forceTurn = rootProject.ext.devBooleanProperty('forceTurn')

loom {
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            property 'safra.p2p.diagnostics', 'true'
            if (forceTurn) {
                property 'safra.p2p.forceTurn', 'true'
            }
            programArg '--username'
            programArg devUsername
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    embed("org.slf4j:slf4j-api:1.7.36") {
        transitive = false
    }
    embed('com.squareup.okhttp3:okhttp:3.12.13')
    embed('com.squareup.okio:okio:1.15.0')
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

processResources {
    inputs.property 'mod_version', project.mod_version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'loader_name', 'fabric'
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_license', project.mod_license
    inputs.property 'mod_description', project.mod_description
    filteringCharset = 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand(
            version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_version: project.loader_version,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_description: project.mod_description
        )
    }

    filesMatching('safra-build.properties') {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_name: 'fabric',
            loader_version: project.loader_version
        )
    }
}
def targetJavaVersion = 17

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('classes') {
    def syncDevResourcesTask = tasks.findByName('syncDevResources')
    if (syncDevResourcesTask != null) {
        dependsOn(syncDevResourcesTask)
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = "${project.archives_base_name}-fabric"
            from components.java
        }
    }

    repositories {
    }
}
