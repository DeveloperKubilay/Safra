plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.1'
    id 'maven-publish'
}

sourceSets {
    main {
        java.srcDir(project(':common').file('src/main/java'))
        resources.srcDir(project(':common').file('src/main/resources'))
        resources.srcDir(project(':common').layout.buildDirectory.dir('generated/quicResources/main'))
    }
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

def devUsername = rootProject.ext.devRunUsername(project)
def quicNettyVersion = rootProject.ext.quicNettyVersion

loom {
    splitEnvironmentSourceSets()

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            property 'io.netty.tryReflectionSetAccessible', 'true'
            property 'safra.p2p.diagnostics', 'true'
            property 'safra.p2p.experimentalQuic', 'true'
            property 'safra.p2p.disableBundledQuicNativeLoad', 'true'
            vmArg '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
            programArg '--username'
            programArg devUsername
        }
        server {
            server()
            property 'io.netty.tryReflectionSetAccessible', 'true'
            property 'safra.p2p.diagnostics', 'false'
            property 'safra.p2p.experimentalQuic', 'true'
            property 'safra.p2p.disableBundledQuicNativeLoad', 'true'
            vmArg '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

configurations {
    quicBundle {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.fabric_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    quicBundle "io.netty:netty-codec-classes-quic:${quicNettyVersion}"
    rootProject.ext.quicAllNativeClassifiers.each { classifier ->
        quicBundle "io.netty:netty-codec-native-quic:${quicNettyVersion}:${classifier}"
    }
    compileOnly "io.netty:netty-codec-classes-quic:${quicNettyVersion}"
    def devNativeClassifier = rootProject.ext.quicNativeClassifier()
    if (devNativeClassifier != null) {
        runtimeOnly "io.netty:netty-codec-native-quic:${quicNettyVersion}:${devNativeClassifier}"
    }
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

processResources {
    dependsOn project(':common').tasks.named('generateQuicCertificate')
    inputs.property 'mod_version', project.mod_version
    inputs.property 'minecraft_version', project.fabric_mod_minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'quic_netty_version', quicNettyVersion
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_license', project.mod_license
    inputs.property 'mod_description', project.mod_description
    filteringCharset = 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand(
            version: project.mod_version,
            minecraft_version: project.fabric_mod_minecraft_version,
            loader_version: project.loader_version,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_description: project.mod_description
        )
    }

    filesMatching('safra-build.properties') {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.fabric_minecraft_version,
            loader_name: 'fabric',
            loader_version: project.loader_version,
            quic_netty_version: quicNettyVersion
        )
    }
}

def targetJavaVersion = 25

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
    from(configurations.quicBundle.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/versions/*/module-info.class'
        exclude 'META-INF/module-info.class'
        exclude 'module-info.class'
    }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn project(':common').tasks.named('generateQuicCertificate')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = "${project.archives_base_name}-fabric"
            from components.java
        }
    }

    repositories {
    }
}
