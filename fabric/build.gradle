plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

sourceSets {
    main {
        java.srcDir(project(':common').file('src/main/java'))
        resources.srcDir(project(':common').file('src/main/resources'))
        def commonCompatBucket = (rootProject.ext.common_bucket ?: '').toString()
        if (commonCompatBucket == '1.20' || commonCompatBucket == '1.20.1') {
            java {
                srcDir(project(':common').file("src/compat/${commonCompatBucket}/java"))
            }
        } else if (commonCompatBucket == '1.20.3-1.20.4') {
            java {
                exclude { details ->
                    details.file.canonicalFile == project(':common').file('src/main/java/org/developerkubilay/safra/p2p/P2pClientProxy.java').canonicalFile
                }
                srcDir(project(':common').file("src/compat/${commonCompatBucket}/java"))
            }
        }
    }
}

def fabricCompatBucket = (rootProject.ext.fabric_bucket ?: '').toString()
if (!fabricCompatBucket.isBlank()) {
    def compatClientFiles = [
        'org/developerkubilay/safra/client/p2p/FabricVersionCompat.java',
        'org/developerkubilay/safra/client/p2p/SafraLanServerSettingsScreen.java',
        'org/developerkubilay/safra/mixin/client/ConnectScreenMixin.java',
        'org/developerkubilay/safra/mixin/client/DirectConnectScreenMixin.java',
        'org/developerkubilay/safra/mixin/client/OpenToLanScreenMixin.java'
    ].collect { relativePath ->
        project.file("src/client/java/${relativePath}").canonicalFile
    }
    sourceSets.matching { it.name == 'client' }.configureEach {
        java {
            exclude { details -> compatClientFiles.contains(details.file.canonicalFile) }
            srcDir("compat/${fabricCompatBucket}/src/client/java")
        }
    }
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

def devUsername = rootProject.ext.devRunUsername(project)
def forceTurn = rootProject.ext.devBooleanProperty('forceTurn')
def forceDirectThenTurn = rootProject.ext.devBooleanProperty('forceDirectThenTurn')

loom {
    splitEnvironmentSourceSets()

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            property 'safra.p2p.diagnostics', 'true'
            if (forceTurn) {
                property 'safra.p2p.forceTurn', 'true'
            }
            if (forceDirectThenTurn) {
                property 'safra.p2p.forceDirectThenTurn', 'true'
            }
            programArg '--username'
            programArg devUsername
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}


dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

processResources {
    inputs.property 'mod_version', project.mod_version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'minecraft_dependency', project.minecraft_dependency
    inputs.property 'loader_version', project.loader_version
    inputs.property 'loader_name', 'fabric'
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_license', project.mod_license
    inputs.property 'mod_description', project.mod_description
    inputs.property 'test_mode', rootProject.ext.buildTestMode
    filteringCharset = 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand(
            version: project.mod_version,
            minecraft_dependency: project.minecraft_dependency,
            loader_version: project.loader_version,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_description: project.mod_description
        )
    }

    filesMatching('safra-build.properties') {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_name: 'fabric',
            loader_version: project.loader_version,
            test_mode: rootProject.ext.buildTestMode
        )
    }
}

def targetJavaVersion = rootProject.ext.java_target_version as int

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = "${project.archives_base_name}-fabric"
            from components.java
        }
    }

    repositories {
    }
}
