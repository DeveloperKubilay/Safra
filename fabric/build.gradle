plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

sourceSets {
    main {
        java.srcDir(project(':common').file('src/main/java'))
        resources.srcDir(project(':common').file('src/main/resources'))
    }
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

def devUsername = rootProject.ext.devRunUsername(project)
def forceDirectThenTurn = rootProject.ext.devBooleanProperty('forceDirectThenTurn')
def splitEnvironmentSources = !project.minecraft_version.startsWith('1.17')

if (!splitEnvironmentSources) {
    sourceSets.main.java.srcDir('src/client/java')
    sourceSets.main.resources.srcDir('src/client/resources')
    sourceSets.main.java.exclude('org/developerkubilay/safra/client/SafraDataGenerator.java')
}

loom {
    if (splitEnvironmentSources) {
        splitEnvironmentSourceSets()
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            if (splitEnvironmentSources) {
                sourceSet sourceSets.client
            }
        }
    }

    runs {
        client {
            property 'safra.p2p.diagnostics', 'true'            if (forceDirectThenTurn) {
                property 'safra.p2p.forceDirectThenTurn', 'true'
            }
            programArg '--username'
            programArg devUsername
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}


dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

processResources {
    inputs.property 'mod_version', project.mod_version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'minecraft_dependency', project.minecraft_dependency
    inputs.property 'java_dependency_version', project.java_dependency_version
    inputs.property 'mixin_compatibility_level', project.mixin_compatibility_level
    inputs.property 'loader_version', project.loader_version
    inputs.property 'loader_name', 'fabric'
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_license', project.mod_license
    inputs.property 'mod_description', project.mod_description
    inputs.property 'test_mode', rootProject.ext.buildTestMode
    filteringCharset = 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand(
            version: project.mod_version,
            minecraft_dependency: project.minecraft_dependency,
            java_dependency_version: project.java_dependency_version,
            loader_version: project.loader_version,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_description: project.mod_description
        )
    }

    filesMatching(['safra.mixins.json', 'safra.client.mixins.json']) {
        expand(
            mixin_compatibility_level: project.mixin_compatibility_level
        )
    }

    filesMatching('safra-build.properties') {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_name: 'fabric',
            loader_version: project.loader_version,
            test_mode: rootProject.ext.buildTestMode
        )
    }
}


tasks.withType(ProcessResources).configureEach {
    inputs.property 'mixin_compatibility_level', project.mixin_compatibility_level
    filteringCharset = 'UTF-8'

    filesMatching('safra.client.mixins.json') {
        expand(
            mixin_compatibility_level: project.mixin_compatibility_level
        )
    }
}

def targetJavaVersion = rootProject.ext.java_target_version as int

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = "${project.archives_base_name}-fabric"
            from components.java
        }
    }

    repositories {
    }
}

