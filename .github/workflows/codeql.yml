name: CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure Gradle JVM for CI
        shell: bash
        run: |
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=${JAVA_HOME} -Dorg.gradle.java.installations.paths=${JAVA_HOME} -Dorg.gradle.java.installations.auto-detect=true" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build project
        shell: bash
        run: |
          ./gradlew clean :fabric:build :forge:build \
            -Pmc_profile=1.20 \
            -Penable_forge=true \
            -Penable_neoforge=false \
            --stacktrace
          ./gradlew clean :fabric:build :forge:build \
            -Pmc_profile=1.20.1 \
            -Penable_forge=true \
            -Penable_neoforge=false \
            --stacktrace
          ./gradlew clean :fabric:build :forge:build \
            -Pmc_profile=1.20.2 \
            -Penable_forge=true \
            -Penable_neoforge=false \
            --stacktrace
          ./gradlew clean :fabric:build \
            -Pmc_profile=1.20.3 \
            -Penable_forge=false \
            -Penable_neoforge=false \
            --stacktrace
          ./gradlew clean :fabric:build :forge:build :neoforge:build \
            -Pmc_profile=1.20.4 \
            -Penable_forge=true \
            -Penable_neoforge=true \
            --stacktrace
          ./gradlew clean :fabric:build :forge:build :neoforge:build \
            -Pmc_profile=1.20.5-1.20.6 \
            -Penable_forge=true \
            -Penable_neoforge=true \
            --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
