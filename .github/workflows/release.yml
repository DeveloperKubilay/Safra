name: Release

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: Version number
        required: true
        type: string
      prerelease:
        description: Publish as prerelease
        required: false
        default: false
        type: boolean
      build_mode:
        description: Network test mode
        required: true
        default: off
        type: choice
        options:
          - off
          - directThenTurn

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.version_number }}-${{ github.event.inputs.build_mode }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure Gradle JVM for CI
        shell: bash
        run: |
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=${JAVA_HOME} -Dorg.gradle.java.installations.paths=${JAVA_HOME} -Dorg.gradle.java.installations.auto-detect=true" >> "$GITHUB_ENV"

      - name: Resolve release version
        shell: bash
        run: |
          branch_name="${GITHUB_REF_NAME}"
          minecraft_version="${branch_name#Safra-}"
          version_number="${{ github.event.inputs.version_number }}"
          build_mode="${{ github.event.inputs.build_mode }}"
          if [[ ! "$version_number" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "Invalid version_number: $version_number"
            exit 1
          fi
          if [[ -z "$minecraft_version" ]]; then
            echo "Could not resolve Minecraft version from branch name: $branch_name"
            exit 1
          fi
          if [[ -z "$build_mode" || "$build_mode" == "false" ]]; then
            build_mode="off"
          fi

          if [[ "$build_mode" != "off" && "$build_mode" != "directThenTurn" ]]; then
            echo "Invalid build_mode: $build_mode"
            exit 1
          fi

          release_tag="Safra-$minecraft_version-$version_number"
          release_title="Safra $minecraft_version-$version_number"
          build_mode_args=""
          if [[ "$build_mode" == "directThenTurn" ]]; then
            release_tag="${release_tag}-${build_mode}"
            release_title="${release_title} (${build_mode})"
            build_mode_args="-PforceDirectThenTurn=true"
          fi

          echo "SAFRA_MINECRAFT_VERSION=$minecraft_version" >> "$GITHUB_ENV"
          echo "SAFRA_VERSION=$version_number" >> "$GITHUB_ENV"
          echo "SAFRA_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "SAFRA_RELEASE_TITLE=$release_title" >> "$GITHUB_ENV"
          echo "SAFRA_BUILD_MODE=$build_mode" >> "$GITHUB_ENV"
          echo "SAFRA_BUILD_MODE_ARGS=$build_mode_args" >> "$GITHUB_ENV"

      - name: Build release artifacts
        shell: bash
        run: |
          ./gradlew clean build --stacktrace \
            -Pmod_version=${{ env.SAFRA_VERSION }} \
            $SAFRA_BUILD_MODE_ARGS

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Safra ${{ env.SAFRA_VERSION }} for Minecraft ${{ env.SAFRA_MINECRAFT_VERSION }}

          Included artifacts:
          - Fabric
          - NeoForge
          - Forge
          
          Build mode:
          - ${{ env.SAFRA_BUILD_MODE }}

          Files are attached from the workflow build output.
          EOF

      - name: Ensure release tag is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "${{ env.SAFRA_TAG }}" >/dev/null 2>&1; then
            echo "Release ${{ env.SAFRA_TAG }} already exists."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          prerelease_flag=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${{ env.SAFRA_TAG }}" build/libs/* \
            --target "${GITHUB_SHA}" \
            --title "${{ env.SAFRA_RELEASE_TITLE }}" \
            --notes-file release-notes.md \
            $prerelease_flag
