name: Release

on:
  workflow_dispatch:
    inputs:
      release_scope:
        description: Release scope
        required: true
        default: all
        type: choice
        options:
          - all
          - single
      mc_version:
        description: Minecraft version for single release mode
        required: true
        default: 1.21.11
        type: choice
        options:
          - 1.21
          - 1.21.1
          - 1.21.2
          - 1.21.3
          - 1.21.4
          - 1.21.5
          - 1.21.6
          - 1.21.8
          - 1.21.9
          - 1.21.10
          - 1.21.11
      version_number:
        description: Mod version
        required: true
        type: string
      prerelease:
        description: Publish as prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.release_scope }}-${{ github.event.inputs.mc_version }}-${{ github.event.inputs.version_number }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure Gradle JVM for CI
        shell: bash
        run: |
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=${JAVA_HOME} -Dorg.gradle.java.installations.paths=${JAVA_HOME} -Dorg.gradle.java.installations.auto-detect=true" >> "$GITHUB_ENV"

      - name: Resolve release plan
        shell: bash
        run: |
          release_scope="${{ github.event.inputs.release_scope }}"
          mc_version="${{ github.event.inputs.mc_version }}"
          version_number="${{ github.event.inputs.version_number }}"
          supported_versions=(1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.8 1.21.9 1.21.10 1.21.11)

          if [[ ! "$version_number" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "Invalid version_number: $version_number"
            exit 1
          fi

          if [[ "$release_scope" == "all" ]]; then
            echo "SAFRA_RELEASE_TAG=Safra-1.21.x-$version_number" >> "$GITHUB_ENV"
            echo "SAFRA_RELEASE_TITLE=Safra 1.21.x-$version_number" >> "$GITHUB_ENV"
            echo "SAFRA_RELEASE_LABEL=1.21.x" >> "$GITHUB_ENV"
            echo "SAFRA_DIST_MODE=matrix" >> "$GITHUB_ENV"
            echo "SAFRA_VERSION_LIST=${supported_versions[*]}" >> "$GITHUB_ENV"
          else
            echo "SAFRA_RELEASE_TAG=Safra-$mc_version-$version_number" >> "$GITHUB_ENV"
            echo "SAFRA_RELEASE_TITLE=Safra $mc_version-$version_number" >> "$GITHUB_ENV"
            echo "SAFRA_RELEASE_LABEL=$mc_version" >> "$GITHUB_ENV"
            echo "SAFRA_DIST_MODE=single" >> "$GITHUB_ENV"
            echo "SAFRA_VERSION_LIST=$mc_version" >> "$GITHUB_ENV"
          fi

          echo "SAFRA_VERSION_NUMBER=$version_number" >> "$GITHUB_ENV"

      - name: Build release artifacts
        shell: bash
        run: |
          if [[ "${{ env.SAFRA_DIST_MODE }}" == "matrix" ]]; then
            ./gradlew collectReleaseMatrixArtifacts --stacktrace \
              -Pmod_version="${{ env.SAFRA_VERSION_NUMBER }}"
          else
            ./gradlew clean build --stacktrace \
              -PmcVersion="${{ github.event.inputs.mc_version }}" \
              -Pmod_version="${{ env.SAFRA_VERSION_NUMBER }}"
          fi

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob

          if [[ "${{ env.SAFRA_DIST_MODE }}" == "matrix" ]]; then
            base_dir="build/release-matrix/${{ env.SAFRA_VERSION_NUMBER }}"
            if [[ ! -d "$base_dir" ]]; then
              echo "Matrix output directory not found: $base_dir"
              exit 1
            fi

            for mc_version in ${{ env.SAFRA_VERSION_LIST }}; do
              version_dir="$base_dir/$mc_version"
              if [[ ! -d "$version_dir" ]]; then
                echo "Missing version directory: $version_dir"
                exit 1
              fi

              jars=("$version_dir"/*.jar)
              if [ "${#jars[@]}" -eq 0 ]; then
                echo "No jars found in $version_dir"
                exit 1
              fi

              for jar in "${jars[@]}"; do
                name="$(basename "$jar")"
                if [[ "$name" == *-dev.jar || "$name" == *-srg.jar ]]; then
                  continue
                fi
                cp "$jar" dist/
              done

              if [[ "$mc_version" == "1.21.2" ]]; then
                note="Forge artifact for 1.21.2 is not available upstream, so this version includes Fabric and NeoForge only."
                loaders="Fabric, NeoForge"
              else
                note=""
                loaders="Fabric, Forge, NeoForge"
              fi

              cat > "dist/build-info-$mc_version.txt" <<EOF
              Minecraft version: $mc_version
              Included loaders: $loaders
              $note
              EOF
            done
          else
            mc_version="${{ github.event.inputs.mc_version }}"
            artifact_dir="build/$mc_version/root/libs"
            if [[ ! -d "$artifact_dir" ]]; then
              echo "Artifact directory not found: $artifact_dir"
              exit 1
            fi

            jars=("$artifact_dir"/*.jar)
            if [ "${#jars[@]}" -eq 0 ]; then
              echo "No jars found in $artifact_dir"
              exit 1
            fi

            for jar in "${jars[@]}"; do
              name="$(basename "$jar")"
              if [[ "$name" == *-dev.jar || "$name" == *-srg.jar ]]; then
                continue
              fi
              cp "$jar" dist/
            done

            if [[ "$mc_version" == "1.21.2" ]]; then
              note="Forge artifact for 1.21.2 is not available upstream, so this version includes Fabric and NeoForge only."
              loaders="Fabric, NeoForge"
            else
              note=""
              loaders="Fabric, Forge, NeoForge"
            fi

            cat > "dist/build-info-$mc_version.txt" <<EOF
            Minecraft version: $mc_version
            Included loaders: $loaders
            $note
            EOF
          fi

          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files collected in dist"
            exit 1
          fi

          ls -la dist

      - name: Verify artifact names
        shell: bash
        run: |
          shopt -s nullglob
          jars=(dist/*.jar)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No jars found in dist"
            exit 1
          fi

          if [[ "${{ env.SAFRA_DIST_MODE }}" == "matrix" ]]; then
            for mc_version in ${{ env.SAFRA_VERSION_LIST }}; do
              expected_suffix="-$mc_version-${{ env.SAFRA_VERSION_NUMBER }}"
              version_found=false
              for jar in "${jars[@]}"; do
                name="$(basename "$jar")"
                if [[ "$name" == *"$expected_suffix"* ]]; then
                  version_found=true
                fi
              done
              if [[ "$version_found" != true ]]; then
                echo "Missing artifacts for $mc_version"
                exit 1
              fi
            done
          else
            expected_suffix="-${{ github.event.inputs.mc_version }}-${{ env.SAFRA_VERSION_NUMBER }}"
            for jar in "${jars[@]}"; do
              name="$(basename "$jar")"
              if [[ "$name" != *"$expected_suffix"* ]]; then
                echo "Artifact version mismatch: $name does not contain $expected_suffix"
                exit 1
              fi
            done
          fi

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Safra ${{ env.SAFRA_VERSION_NUMBER }} for Minecraft ${{ env.SAFRA_RELEASE_LABEL }}

          Included artifacts:
          - Fabric
          - Forge
          - NeoForge

          Notes:
          - 1.21.2 ships without Forge because the upstream Forge artifact is unavailable.
          - All mode builds run sequentially on the same GitHub Actions runner.
          - Each Minecraft version still gets its own real build with its own dependencies and version-specific sources.
          EOF

      - name: Ensure release tag is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "${{ env.SAFRA_RELEASE_TAG }}" >/dev/null 2>&1; then
            echo "Release ${{ env.SAFRA_RELEASE_TAG }} already exists."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          prerelease_flag=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${{ env.SAFRA_RELEASE_TAG }}" dist/* \
            --title "${{ env.SAFRA_RELEASE_TITLE }}" \
            --notes-file release-notes.md \
            $prerelease_flag
