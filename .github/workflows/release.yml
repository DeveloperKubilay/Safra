name: Release

on:
  workflow_dispatch:
    inputs:
      minecraft_target:
        description: Minecraft target
        required: true
        default: 26.1
        type: choice
        options:
          - 26.1
          - 26.1.1
          - 26.1.2
      version_number:
        description: Version number
        required: true
        type: string
      prerelease:
        description: Publish as prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.minecraft_target }}-${{ github.event.inputs.version_number }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure Gradle JVM for CI
        shell: bash
        run: |
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=${JAVA_HOME} -Dorg.gradle.java.installations.paths=${JAVA_HOME} -Dorg.gradle.java.installations.auto-detect=true" >> "$GITHUB_ENV"

      - name: Resolve release profile
        shell: bash
        run: |
          minecraft_target="${{ github.event.inputs.minecraft_target }}"
          version_number="${{ github.event.inputs.version_number }}"
          if [[ ! "$version_number" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "Invalid version_number: $version_number"
            exit 1
          fi

          case "$minecraft_target" in
            26.1)
              fabric_minecraft_version="26.1"
              fabric_mod_minecraft_version="26.1"
              fabric_version="0.145.1+26.1"
              minecraft_version="26.1"
              forge_version="62.0.9"
              neo_version="26.1.0.19-beta"
              minecraft_version_range="[26.1,26.2)"
              forge_minecraft_version_range="[26.1,26.2)"
              neo_version_range="[26.1.0.19-beta,)"
              ;;
            26.1.1)
              fabric_minecraft_version="26.1.1"
              fabric_mod_minecraft_version="26.1.1"
              fabric_version="0.145.4+26.1.1"
              minecraft_version="26.1.1"
              forge_version="63.0.1"
              neo_version="26.1.1.15-beta"
              minecraft_version_range="[26.1.1,26.2)"
              forge_minecraft_version_range="[26.1.1,26.2)"
              neo_version_range="[26.1.1.15-beta,)"
              ;;
            26.1.2)
              fabric_minecraft_version="26.1.2"
              fabric_mod_minecraft_version="26.1.2"
              fabric_version="0.149.0+26.1.2"
              minecraft_version="26.1.2"
              forge_version="64.0.6"
              neo_version="26.1.2.54-beta"
              minecraft_version_range="[26.1.2,26.2)"
              forge_minecraft_version_range="[26.1.2,26.2)"
              neo_version_range="[26.1.2.54-beta,)"
              ;;
            *)
              echo "Unsupported minecraft_target: $minecraft_target"
              exit 1
              ;;
          esac

          echo "SAFRA_MINECRAFT_VERSION=$minecraft_target" >> "$GITHUB_ENV"
          echo "SAFRA_VERSION=$version_number" >> "$GITHUB_ENV"
          echo "SAFRA_TAG=Safra-$minecraft_target-$version_number" >> "$GITHUB_ENV"
          echo "SAFRA_FABRIC_MINECRAFT_VERSION=$fabric_minecraft_version" >> "$GITHUB_ENV"
          echo "SAFRA_FABRIC_MOD_MINECRAFT_VERSION=$fabric_mod_minecraft_version" >> "$GITHUB_ENV"
          echo "SAFRA_FABRIC_VERSION=$fabric_version" >> "$GITHUB_ENV"
          echo "SAFRA_FORGE_VERSION=$forge_version" >> "$GITHUB_ENV"
          echo "SAFRA_NEO_VERSION=$neo_version" >> "$GITHUB_ENV"
          echo "SAFRA_MC_VERSION=$minecraft_version" >> "$GITHUB_ENV"
          echo "SAFRA_MC_VERSION_RANGE=$minecraft_version_range" >> "$GITHUB_ENV"
          echo "SAFRA_FORGE_MC_RANGE=$forge_minecraft_version_range" >> "$GITHUB_ENV"
          echo "SAFRA_NEO_VERSION_RANGE=$neo_version_range" >> "$GITHUB_ENV"

      - name: Build release artifacts
        shell: bash
        run: |
          ./gradlew clean build --stacktrace \
            -Pmod_version="${{ env.SAFRA_VERSION }}" \
            -Pfabric_minecraft_version="${{ env.SAFRA_FABRIC_MINECRAFT_VERSION }}" \
            -Pfabric_mod_minecraft_version="${{ env.SAFRA_FABRIC_MOD_MINECRAFT_VERSION }}" \
            -Pfabric_version="${{ env.SAFRA_FABRIC_VERSION }}" \
            -Pminecraft_version="${{ env.SAFRA_MC_VERSION }}" \
            -Pforge_version="${{ env.SAFRA_FORGE_VERSION }}" \
            -Pneo_version="${{ env.SAFRA_NEO_VERSION }}" \
            -Pminecraft_version_range="${{ env.SAFRA_MC_VERSION_RANGE }}" \
            -Pforge_minecraft_version_range="${{ env.SAFRA_FORGE_MC_RANGE }}" \
            -Pneo_version_range="${{ env.SAFRA_NEO_VERSION_RANGE }}"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Safra ${{ env.SAFRA_VERSION }} for Minecraft ${{ env.SAFRA_MINECRAFT_VERSION }}

          Included artifacts:
          - Fabric
          - NeoForge
          - Forge

          Files are attached from the workflow build output.
          EOF

      - name: Ensure release tag is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "${{ env.SAFRA_TAG }}" >/dev/null 2>&1; then
            echo "Release ${{ env.SAFRA_TAG }} already exists."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          prerelease_flag=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${{ env.SAFRA_TAG }}" build/libs/* \
            --target "${GITHUB_SHA}" \
            --title "Safra ${{ env.SAFRA_MINECRAFT_VERSION }}-${{ env.SAFRA_VERSION }}" \
            --notes-file release-notes.md \
            $prerelease_flag
