name: Release

on:
  workflow_dispatch:
    inputs:
      release_scope:
        description: Release scope
        required: true
        default: all
        type: choice
        options:
          - all
          - single
      mc_version:
        description: Minecraft version for single release mode
        required: true
        default: 1.20.6
        type: choice
        options:
          - 1.20
          - 1.20.1
          - 1.20.2
          - 1.20.3
          - 1.20.4
          - 1.20.6
      version_number:
        description: Mod version
        required: true
        type: string
      prerelease:
        description: Publish as prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.release_scope }}-${{ github.event.inputs.mc_version }}-${{ github.event.inputs.version_number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions_json: ${{ steps.prepare.outputs.versions_json }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      release_title: ${{ steps.prepare.outputs.release_title }}
      release_scope: ${{ steps.prepare.outputs.release_scope }}
      release_versions_label: ${{ steps.prepare.outputs.release_versions_label }}
      version_number: ${{ steps.prepare.outputs.version_number }}

    steps:
      - name: Resolve release plan
        id: prepare
        shell: bash
        run: |
          release_scope="${{ github.event.inputs.release_scope }}"
          mc_version="${{ github.event.inputs.mc_version }}"
          version_number="${{ github.event.inputs.version_number }}"
          supported_versions='["1.20","1.20.1","1.20.2","1.20.3","1.20.4","1.20.6"]'

          if [[ ! "$version_number" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "Invalid version_number: $version_number"
            exit 1
          fi

          if [[ "$release_scope" == "all" ]]; then
            versions_json="$supported_versions"
            release_tag="Safra-1.20.x-$version_number"
            release_title="Safra 1.20.x-$version_number"
            release_versions_label="1.20.x"
          else
            versions_json="[\"$mc_version\"]"
            release_tag="Safra-$mc_version-$version_number"
            release_title="Safra $mc_version-$version_number"
            release_versions_label="$mc_version"
          fi

          {
            echo "versions_json=$versions_json"
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
            echo "release_scope=$release_scope"
            echo "release_versions_label=$release_versions_label"
            echo "version_number=$version_number"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mc_version: ${{ fromJson(needs.prepare.outputs.versions_json) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure Gradle JVM for CI
        shell: bash
        run: |
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=${JAVA_HOME} -Dorg.gradle.java.installations.paths=${JAVA_HOME} -Dorg.gradle.java.installations.auto-detect=true" >> "$GITHUB_ENV"

      - name: Resolve build plan
        shell: bash
        run: |
          mc_version="${{ matrix.mc_version }}"
          case "$mc_version" in
            1.20)
              echo "SAFRA_MC_PROFILE=1.20" >> "$GITHUB_ENV"
              echo "SAFRA_ARTIFACT_VERSION=1.20" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_NEOFORGE=false" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_FORGE=true" >> "$GITHUB_ENV"
              echo "SAFRA_BUILD_TASKS=:fabric:build :forge:build" >> "$GITHUB_ENV"
              echo "SAFRA_LOADERS=Fabric, Forge" >> "$GITHUB_ENV"
              echo "SAFRA_RELEASE_NOTE=" >> "$GITHUB_ENV"
              ;;
            1.20.1)
              echo "SAFRA_MC_PROFILE=1.20.1" >> "$GITHUB_ENV"
              echo "SAFRA_ARTIFACT_VERSION=1.20.1" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_NEOFORGE=false" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_FORGE=true" >> "$GITHUB_ENV"
              echo "SAFRA_BUILD_TASKS=:fabric:build :forge:build" >> "$GITHUB_ENV"
              echo "SAFRA_LOADERS=Fabric, Forge" >> "$GITHUB_ENV"
              echo "SAFRA_RELEASE_NOTE=" >> "$GITHUB_ENV"
              ;;
            1.20.2)
              echo "SAFRA_MC_PROFILE=1.20.2" >> "$GITHUB_ENV"
              echo "SAFRA_ARTIFACT_VERSION=1.20.2" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_NEOFORGE=false" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_FORGE=true" >> "$GITHUB_ENV"
              echo "SAFRA_BUILD_TASKS=:fabric:build :forge:build" >> "$GITHUB_ENV"
              echo "SAFRA_LOADERS=Fabric, Forge" >> "$GITHUB_ENV"
              echo "SAFRA_RELEASE_NOTE=" >> "$GITHUB_ENV"
              ;;
            1.20.3)
              echo "SAFRA_MC_PROFILE=1.20.3-1.20.4" >> "$GITHUB_ENV"
              echo "SAFRA_ARTIFACT_VERSION=1.20.3" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_NEOFORGE=true" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_FORGE=false" >> "$GITHUB_ENV"
              echo "SAFRA_BUILD_TASKS=:fabric:build :neoforge:build" >> "$GITHUB_ENV"
              echo "SAFRA_LOADERS=Fabric, NeoForge" >> "$GITHUB_ENV"
              echo "SAFRA_RELEASE_NOTE=Forge 1.20.3 artifacti kasitli olarak yayinlanmiyor; bu surum Fabric ve NeoForge olarak cikiyor." >> "$GITHUB_ENV"
              ;;
            1.20.4)
              echo "SAFRA_MC_PROFILE=1.20.3-1.20.4" >> "$GITHUB_ENV"
              echo "SAFRA_ARTIFACT_VERSION=1.20.4" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_NEOFORGE=true" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_FORGE=true" >> "$GITHUB_ENV"
              echo "SAFRA_BUILD_TASKS=:fabric:build :forge:build :neoforge:build" >> "$GITHUB_ENV"
              echo "SAFRA_LOADERS=Fabric, Forge, NeoForge" >> "$GITHUB_ENV"
              echo "SAFRA_RELEASE_NOTE=" >> "$GITHUB_ENV"
              ;;
            1.20.5)
              echo "SAFRA_MC_PROFILE=1.20.5-1.20.6" >> "$GITHUB_ENV"
              echo "SAFRA_ARTIFACT_VERSION=$mc_version" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_NEOFORGE=true" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_FORGE=false" >> "$GITHUB_ENV"
              echo "SAFRA_BUILD_TASKS=:fabric:build :neoforge:build" >> "$GITHUB_ENV"
              echo "SAFRA_LOADERS=Fabric, NeoForge" >> "$GITHUB_ENV"
              echo "SAFRA_RELEASE_NOTE=Forge artifact for 1.20.5 is intentionally not published because Forge 1.20.5 is not available." >> "$GITHUB_ENV"
              ;;
            1.20.6)
              echo "SAFRA_MC_PROFILE=1.20.5-1.20.6" >> "$GITHUB_ENV"
              echo "SAFRA_ARTIFACT_VERSION=$mc_version" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_NEOFORGE=true" >> "$GITHUB_ENV"
              echo "SAFRA_ENABLE_FORGE=true" >> "$GITHUB_ENV"
              echo "SAFRA_BUILD_TASKS=:fabric:build :forge:build :neoforge:build" >> "$GITHUB_ENV"
              echo "SAFRA_LOADERS=Fabric, Forge, NeoForge" >> "$GITHUB_ENV"
              echo "SAFRA_RELEASE_NOTE=" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported mc_version: $mc_version"
              exit 1
              ;;
          esac

      - name: Build release artifacts
        shell: bash
        run: |
          ./gradlew clean ${{ env.SAFRA_BUILD_TASKS }} --stacktrace \
            -Pmc_profile="${{ env.SAFRA_MC_PROFILE }}" \
            -Pmod_version="${{ needs.prepare.outputs.version_number }}" \
            -Penable_neoforge="${{ env.SAFRA_ENABLE_NEOFORGE }}" \
            -Penable_forge="${{ env.SAFRA_ENABLE_FORGE }}"

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p dist

          loader_paths=()
          for loader in ${{ env.SAFRA_BUILD_TASKS }}; do
            project_name="${loader#:}"
            project_name="${project_name%:build}"
            loader_paths+=("build/${{ env.SAFRA_MC_PROFILE }}/$project_name/libs")
          done

          shopt -s nullglob
          found_any=false
          for artifact_dir in "${loader_paths[@]}"; do
            if [[ ! -d "$artifact_dir" ]]; then
              echo "Artifact directory not found: $artifact_dir"
              exit 1
            fi

            jars=("$artifact_dir"/*.jar)
            if [ "${#jars[@]}" -eq 0 ]; then
              echo "No jars found in $artifact_dir"
              exit 1
            fi

            for jar in "${jars[@]}"; do
              name="$(basename "$jar")"
              if [[ "$name" == *-dev.jar || "$name" == *-srg.jar ]]; then
                continue
              fi
              public_name="${name/-${SAFRA_MC_PROFILE}-/-${SAFRA_ARTIFACT_VERSION}-}"
              cp "$jar" "dist/$public_name"
              found_any=true
            done
          done

          if [[ "$found_any" != true ]]; then
            echo "No release jars were collected."
            exit 1
          fi

          cat > "dist/build-info-${{ matrix.mc_version }}.txt" <<EOF
          Minecraft version: ${{ matrix.mc_version }}
          Minecraft profile: ${{ env.SAFRA_MC_PROFILE }}
          Included loaders: ${{ env.SAFRA_LOADERS }}
          ${{ env.SAFRA_RELEASE_NOTE }}
          EOF

          ls -la dist

      - name: Verify artifact names
        shell: bash
        run: |
          shopt -s nullglob
          jars=(dist/*.jar)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No jars found in dist"
            exit 1
          fi

          expected_suffix="-${{ env.SAFRA_ARTIFACT_VERSION }}-${{ needs.prepare.outputs.version_number }}"
          for jar in "${jars[@]}"; do
            name="$(basename "$jar")"
            if [[ "$name" != *"$expected_suffix"* ]]; then
              echo "Artifact version mismatch: $name does not contain $expected_suffix"
              exit 1
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.mc_version }}
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Verify downloaded artifacts
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded."
            exit 1
          fi
          ls -la dist

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Safra ${{ needs.prepare.outputs.version_number }} for Minecraft ${{ needs.prepare.outputs.release_versions_label }}

          Included artifacts:
          - 1.20: Fabric, Forge
          - 1.20.1: Fabric, Forge
          - 1.20.2: Fabric, Forge
          - 1.20.3: Fabric, NeoForge
          - 1.20.4: Fabric, Forge, NeoForge
          - 1.20.6: Fabric, Forge, NeoForge

          Notes:
          - 1.20.3 Forge build intentionally not released.
          - 1.20.5 Forge build intentionally not released because Forge 1.20.5 is not available.
          EOF

      - name: Ensure release tag is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "${{ needs.prepare.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "Release ${{ needs.prepare.outputs.release_tag }} already exists."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          prerelease_flag=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${{ needs.prepare.outputs.release_tag }}" dist/* \
            --title "${{ needs.prepare.outputs.release_title }}" \
            --notes-file release-notes.md \
            $prerelease_flag
