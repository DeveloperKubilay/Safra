name: Network tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'common/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'libs/kwik/**'
      - '.github/workflows/network-tests.yml'
  pull_request:
    paths:
      - 'common/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'libs/kwik/**'
      - '.github/workflows/network-tests.yml'

permissions:
  contents: read

concurrency:
  group: network-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Safra and changing network conditions
        run: bash ./gradlew :common:test -PnetworkTests=true --configure-on-demand --stacktrace
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-reports
          path: |
            build/*/common/reports/
            build/*/common/test-results/
