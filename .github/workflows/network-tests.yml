name: Network tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'common/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'tools/prepare_kwik.py'
      - '.github/workflows/network-tests.yml'
  pull_request:
    paths:
      - 'common/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'tools/prepare_kwik.py'
      - '.github/workflows/network-tests.yml'

permissions:
  contents: read

concurrency:
  group: network-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Kwik sources
        run: python3 tools/prepare_kwik.py
      - name: Test Kwik
        working-directory: ../kwik
        run: bash ./gradlew :kwik:test --stacktrace
      - name: Test Safra and changing network conditions
        run: bash ./gradlew :common:test -PnetworkTests=true --configure-on-demand --stacktrace
      - name: Collect Kwik reports
        if: always()
        run: |
          mkdir -p build/kwik-reports
          for report in ../kwik/core/build/reports/tests ../kwik/core/build/test-results; do
            if [ -d "$report" ]; then cp -R "$report" build/kwik-reports/; fi
          done
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-reports
          path: |
            build/*/common/reports/
            build/*/common/test-results/
            build/kwik-reports/
