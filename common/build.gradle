plugins {
    id 'java-library'
}

base {
    archivesName = "${project.archives_base_name}-common"
}

def targetJavaVersion = rootProject.ext.java_target_version as int
def commonCompatBucket = (rootProject.ext.common_bucket ?: '').toString()

sourceSets {
    main {
        if (commonCompatBucket == '1.20' || commonCompatBucket == '1.20.1') {
            java {
                srcDir("src/compat/${commonCompatBucket}/java")
            }
        } else if (commonCompatBucket == '1.20.3-1.20.4') {
            java {
                exclude { details ->
                    details.file.canonicalFile == file('src/main/java/org/developerkubilay/safra/p2p/P2pClientProxy.java').canonicalFile
                }
                srcDir("src/compat/${commonCompatBucket}/java")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

dependencies {
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'com.google.guava:guava:33.4.8-jre'
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

processResources {
    inputs.property 'mod_version', project.mod_version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_name', 'common'
    inputs.property 'loader_version', 'unknown'
    inputs.property 'test_mode', rootProject.ext.buildTestMode
    filteringCharset = 'UTF-8'

    filesMatching('safra-build.properties') {
        expand(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            loader_name: 'common',
            loader_version: 'unknown',
            test_mode: rootProject.ext.buildTestMode
        )
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}
